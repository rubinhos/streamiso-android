name: Release

# A release comes out by itself when a push to master changes the app or its build, with the next patch
# number. Pushing a tag such as v0.2.0 by hand also releases, and sets where the numbering continues.
on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
    tags: ["v*"]

# One at a time, so that two merges in a row cannot pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Choose the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            if ! printf '%s' "$tag" | grep -Eq "$pattern"; then
              echo "::error::The tag must look like v1.2.3, got: $tag"
              exit 1
            fi
          elif git tag --points-at HEAD | grep -Eq "$pattern"; then
            echo "::notice::This commit already has a version tag, so there is nothing to release."
            exit 0
          else
            latest="$(git tag -l 'v*' | grep -E "$pattern" | sort -V | tail -n 1 || true)"
            if [ -z "$latest" ]; then
              tag=v0.1.0
            else
              tag="${latest%.*}.$(( ${latest##*.} + 1 ))"
            fi
          fi
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # No Gradle cache here on purpose: a release must not reuse files saved by earlier runs.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set. See 'Signing key and secrets' in the README."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # AGP only creates unit test tasks for the debug variant, and they test the same code.
      - name: Build and sign the release APK
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          STREAMISO_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-build-cache testDebugUnitTest assembleRelease "-PappVersion=$APP_VERSION"

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the signature and name the APK
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/streamiso-$APP_VERSION.apk"
          (cd dist && sha256sum "streamiso-$APP_VERSION.apk" > "streamiso-$APP_VERSION.apk.sha256")

      # Creates the tag too, on an automatic release. A tag pushed by hand stays where it is.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes --title "StreamISO for Android $APP_VERSION"
